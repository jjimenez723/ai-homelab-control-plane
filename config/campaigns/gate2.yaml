# Gate-2 validation bakeoff (D-041, D-044, D-053).
#
# A real run may auto-pull ONLY these explicitly approved Ollama tags.
# The runner resolves each local model's actual digest and quantization after
# staging and includes them in the configuration fingerprint. This profile is
# validation comparison evidence, not frozen-holdout certification evidence.

version: 1
campaign_id: gate2-validation-001
description: >
  Gate-2 validation bakeoff across the four local candidate families already
  established by Phase-2 work. Memory-aware scheduler may run small candidates
  concurrently when they fit; frozen-holdout campaigns are serialized.

samples_per_item: 5
timeout_seconds: 120

# Maximum simultaneous candidate batches. The scheduler also enforces its
# conservative physical-memory budget, so this is a ceiling rather than a
# promise that four models will be resident at once.
concurrency: 4

suites:
  - id: acb-v1/routing-classification
    split: validation
    threshold:
      min_pass_rate: 0.80
      min_confidence: 0.60
      max_timeout_rate: 0.05
      max_provider_error_rate: 0.05
  - id: acb-v1/semantic-naming
    split: validation
    threshold:
      min_pass_rate: 0.75
      min_confidence: 0.60
      max_timeout_rate: 0.05
      max_provider_error_rate: 0.05

candidates:
  - name: qwen2.5-0.5b-ollama
    model: qwen2.5:0.5b
    runtime: ollama
    endpoint: http://127.0.0.1:11434
    tool_schema_version: none
    sampling: &bounded_sampling
      temperature: 0
      seed: 42
      num_ctx: 4096
      num_predict: 64
    prompts: &gate2_prompts
      acb-v1/routing-classification:
        prompt_id: acb-v1-routing-classification
        prompt_version: "1.0.0"
      acb-v1/semantic-naming:
        prompt_id: acb-v1-semantic-naming
        prompt_version: "1.0.0"

  - name: qwen3.5-4b-ollama
    model: qwen3.5:4b
    runtime: ollama
    endpoint: http://127.0.0.1:11434
    tool_schema_version: none
    sampling: *bounded_sampling
    prompts: *gate2_prompts

  - name: qwen3.5-9b-ollama
    model: qwen3.5:9b
    runtime: ollama
    endpoint: http://127.0.0.1:11434
    tool_schema_version: none
    sampling: *bounded_sampling
    prompts: *gate2_prompts

  - name: gpt-oss-20b-ollama
    model: gpt-oss:20b
    runtime: ollama
    endpoint: http://127.0.0.1:11434
    tool_schema_version: none
    sampling: *bounded_sampling
    prompts: *gate2_prompts
