# Human-editable configuration for the `organize` manual-first ingestion CLI.
#
# Copy this file to `config/ingest.yaml` (ignored by git; see .gitignore) and
# adjust paths/UUIDs for this machine. `organize` looks for `config/ingest.yaml`
# by default, or a path given with `--config`.
#
# Nothing in this file as shipped makes anything run automatically. Desktop and
# Documents are only ever scanned or moved when the CLI is invoked by hand, and
# that does not change: the scheduled agent's only sources are Downloads and
# Screenshots. Unattended running requires `automation.enabled: true` below AND
# installing the LaunchAgent; transferring anything automatically additionally
# requires `triage.auto_ingest: true`. Both are false here.
# (See PLAN.md Phase 1A/1B and DECISIONS.md D-016, D-020, D-024.)

t7:
  # Preferred: pin the T7 by its stable volume UUID (see `diskutil info /Volumes/<name>`).
  # The T7 is APFS (Encrypted) after the 2026-09-11 erase/recreate (D-019).
  # `organize` refuses to run --apply if no mounted volume has this UUID.
  volume_uuid: "REPLACE-WITH-T7-VOLUME-UUID"

  # Optional development/testing convenience: a fixed filesystem path used instead of
  # UUID detection. Only set this for local dev/test roots, never for the real T7.
  storage_root_override: null

  # Sub-path under the resolved T7 root where verified assets land before
  # AI classification proposes a client/project destination.
  inbox_relative_path: "00-inbox/organized"

  # Sub-path under the resolved T7 root used for .partial staging files,
  # the catalog, and sidecars.
  system_relative_path: "90-system"

sources:
  desktop: "~/Desktop"
  documents: "~/Documents"
  downloads: "~/Downloads"

  # Registered removable-media source volumes. Only UUIDs listed here are ever
  # eligible for `organize sd`; any other mounted removable disk is ignored.
  sd_volume_uuids: []

  # Screenshots are a first-class source for NAMING. They are not a vacuum:
  # a screenshot being named says nothing about whether it belongs in Angel.
  #
  # There is no default path, and none is ever inferred. macOS keeps the real
  # location in `com.apple.screencapture location`, which on a default install
  # is ~/Desktop -- so a silent fallback would put the entire Desktop under
  # automatic evaluation. `organize doctor` prints what macOS currently says so
  # you can paste it here deliberately.
  #
  # If this path is also your Desktop/Documents/Downloads, only files whose
  # names identify them as screen captures are evaluated.
  screenshots:
    path: null
    enabled: false

# How long (seconds) a file's mtime must be unchanged before it is considered
# settled/safe to move. Applies to manual Desktop/Documents/Downloads/SD runs.
settle_seconds: 30

# The scheduled (`--automated`) run must wait at least this long after a file
# last changed before it may touch it. An automated run always uses the LONGER
# of this and `settle_seconds`, so lowering the manual window above can never
# shorten what the unattended job waits.
downloads_watcher_min_settle_seconds: 1200


# -- File naming -------------------------------------------------------------
#
# Naming and retention are separate decisions. A file may deserve a useful
# filename without deserving permanent storage in Angel, and renaming a file
# never moves it.
naming:
  enabled: true

  # Which source classes are evaluated for naming. `desktop` and `documents`
  # are deliberately absent: this phase never evaluates them automatically.
  source_classes:
    - screenshots
    - downloads
    - sd

  # Below this confidence a proposal is recorded and ignored rather than
  # applied. Raise it to be more conservative.
  min_confidence: 0.55

  # Maximum length of a generated filename, including its extension.
  max_filename_length: 120

  # Never renamed however poor the name looks: something else on the system
  # finds these by name.
  protected_extensions:
    - .app
    - .dmg
    - .pkg
    - .mpkg
    - .framework
    - .kext

  # Words your own clients and projects use. A filename containing one is
  # treated as already meaningful, which is how short client codes survive.
  # Matched on whole words, never as a substring.
  vocabulary: []

  # Which proposer answers "what should this file be called?" (D-057).
  #
  #   deterministic  names only from measured facts and text the file itself
  #                  contains -- a PDF's title, its first heading, the title
  #                  line of OCR on a screenshot, camera EXIF, dimensions.
  #                  Never from a vision description or a speech transcript:
  #                  those are summaries, not quotations.
  #   semantic       asks a local model (loopback-only Ollama) through the
  #                  exact versioned prompt the Gate-2 naming suite evaluates,
  #                  reading the same perceived evidence plus the visual
  #                  description and transcript. Every answer still goes
  #                  through the identical filename policy, and anything
  #                  path-shaped, invisible, extension-changing, or over-long
  #                  is refused outright.
  #
  # `enabled: false` above still wins over this: turning the model on is two
  # deliberate settings, not one.
  proposer: deterministic

  semantic:
    # An Ollama tag that is already installed locally. Nothing here pulls a
    # model; an absent one degrades to the deterministic proposer.
    model: "qwen3.5:4b"

    # Loopback HTTP only, enforced by the single Ollama client in this repo
    # (tools/models/ollama_local.py). Anything else is refused the moment the
    # client is constructed -- which this proposer records as a fallback with
    # a stated reason rather than failing the run.
    endpoint: "http://127.0.0.1:11434"

    timeout_seconds: 60

    # A filename is short. More tokens than this only buys an explanation
    # that nothing downstream reads.
    num_predict: 64

    # The model never scores itself: confidence is derived deterministically
    # from the name it produced against the evidence it was shown (see
    # tools/ingest/naming/semantic.py). Below this, the answer is discarded.
    min_confidence: 0.6

    # When the model is unreachable, times out, or produces something
    # unusable, let the deterministic proposer answer instead. Setting this
    # to false means "a model names it or nothing does".
    fallback_to_deterministic: true


# -- Retention triage --------------------------------------------------------
#
# Three outcomes: ignore (not for Angel), review (a person decides), ingest (a
# candidate). None of them deletes anything from the Mac. The only file removal
# in this system is the source unlink inside the verified transfer, after the
# bytes are provably on Angel.
triage:
  enabled: true

  # OFF by default. While this is false, nothing is ever transferred
  # automatically -- candidates are reported and left where they are.
  auto_ingest: false

  # Even with auto_ingest on, only decisions at or above this confidence are
  # acted on. Everything else waits for review.
  min_ingest_confidence: 0.85

  # Re-downloadable, and not a record of anything. Ignored on sight.
  installer_extensions:
    - .dmg
    - .pkg
    - .mpkg
    - .iso
    - .exe
    - .msi
    - .deb
    - .rpm
    - .appimage

  # Transient artifacts.
  ignore_extensions:
    - .torrent
    - .crdownload
    - .part
    - .download
    - .tmp

  document_extensions:
    - .pdf
    - .docx
    - .doc
    - .pages
    - .key
    - .pptx
    - .xlsx
    - .numbers
    - .csv
    - .rtf

  # Below this size an image or video is assumed to be an icon or a fragment.
  min_interesting_bytes: 4096


# -- Automation --------------------------------------------------------------
#
# The scheduled LaunchAgent refuses to run while this is false, and
# `scripts/install-file-intelligence-launchd` refuses to install it. Turning it
# on is the single deliberate act that lets this pipeline run unattended.
automation:
  enabled: false

  # Run lock, last-run status, and logs. Relative to the checkout.
  state_relative_path: ".state/file-intelligence"

  # An absolute state directory, if run state must live outside the
  # checkout (an acceptance drill, a test). Normally left unset;
  # `state_relative_path` is deliberately relative-only so a stray value
  # can never point run state at a filesystem root.
  state_dir: null

exclusions:
  # Directory names skipped anywhere in a source tree (not reported individually).
  dir_names:
    - node_modules
    - .venv
    - venv
    - env
    - .tox
    - __pycache__
    - .mypy_cache
    - .pytest_cache
    - .git

  # Directories treated as a single opaque unit (never descended into or moved
  # piece by piece) because moving their internal files independently would
  # corrupt them.
  bundle_extensions:
    - .app
    - .bundle
    - .framework
    - .plugin
    - .kext
    - .photoslibrary
    - .xcodeproj
    - .xcworkspace

  # Suffixes that mark an in-progress/incomplete browser download.
  incomplete_download_suffixes:
    - .crdownload
    - .download
    - .part

  # A file or directory literally named this, present in a directory, excludes
  # that directory (and everything under it) from ingestion.
  keep_local_marker: ".keep-local"

  # Additional absolute paths to always exclude, beyond the automatic
  # self-exclusion of this repository and the resolved T7 root.
  extra_paths: []

# -- Visual & document evidence layer ----------------------------------------
#
# Perception. This layer reads native text, runs OCR, and asks a vision
# backend to describe an image -- and caches the result, content-hash-keyed,
# in the local ledger.
#
# Since D-057 exactly one decision reads it: the *filename* proposal under
# `naming:` above. It still grants no authority to move, delete, or ingest
# anything, and `triage:` (what belongs in Angel) and `automation:` read
# nothing produced here -- two files differing only in what was perceived
# about them get the identical retention decision, which is a test, not a
# claim. What a proposer does with this evidence is a string, and
# tools/ingest/naming/policy.py validates it before it can become a filename.
#
# Extracted text is stored only on this Mac (never on the T7/Angel catalog)
# and only up to `max_text_chars`; see the evidence-layer spec for the full
# privacy posture.
evidence:
  enabled: true

  # Files above this size are skipped entirely: nothing is rasterized and no
  # backend is invoked.
  max_bytes: 104857600  # 100 MiB

  # A document past this many pages only has its first pages perceived.
  max_pages: 20

  # Resolution used when rasterizing a PDF/document page to an in-memory PNG
  # for OCR/vision. Higher improves OCR accuracy on small text; also raises
  # memory use per page.
  raster_dpi: 200

  # Decompression-bomb guard for a rasterized page, mirroring the same
  # guard the deterministic image probe applies to source images.
  raster_max_pixels: 40000000

  # Extracted text (native or OCR) is capped at this many characters per
  # file before it is stored; truncation is recorded, never silent.
  max_text_chars: 20000

  ocr:
    enabled: true
    # "null" performs no OCR at all -- the safe default until an operator
    # opts into "tesseract" on a machine that actually has it installed.
    backend: "null"
    timeout_seconds: 30
    # An OCR result with more text regions than this is truncated, with a
    # warning, rather than accepted unbounded.
    max_blocks: 2000

  vision:
    enabled: true
    # "heuristic" makes no model call: it is a deterministic, offline
    # description built only from already-measured facts. "null" performs
    # no vision perception at all.
    backend: "heuristic"
    timeout_seconds: 30
    # Opt-in real local VLM (Ollama, loopback only):
    # backend: "ollama"
    # model: "qwen3-vl:8b"
    # endpoint: "http://127.0.0.1:11434"
    # max_image_bytes: 8000000
    # max_prompt_chars: 4000
    #
    # How many frames a video is sampled into for vision/OCR, evenly spaced
    # across its duration (1-12; more catches a subject that only appears
    # partway through a clip, at the cost of one backend call per frame).
    video_frame_count: 5
    # Collapse near-identical sampled frames to one representative before
    # OCR/vision run, so a static screen recording costs one backend call
    # rather than `video_frame_count` descriptions of the same picture.
    frame_dedupe: true
    # Sample fewer frames from a clip too short to hold that many distinct
    # moments (under 4s -> at most 2 frames; under 1s -> exactly 1).
    frame_duration_aware: true

  # Speech transcription: the third perception seam (D-058). Off by default --
  # it needs the optional whisper.cpp binary (`brew install whisper.cpp`,
  # providing `whisper-cli`) plus a ggml model file this repository does not
  # ship. Audio is decoded to an in-memory 16 kHz mono WAV and fed to the
  # engine on stdin; no temporary file is ever written.
  transcription:
    enabled: false
    # "null" performs no transcription at all and records that it did not.
    backend: "null"
    # Opt-in real local speech-to-text:
    # backend: "whisper-cpp"
    #
    # Where the ggml model lives. Leave unset to resolve the sanctioned Angel
    # whisper cache (`40-ai/model-cache/whisper`) through the AI-storage
    # helper's `WHISPER_CACHE_DIR`; set it explicitly to name one model file.
    # model_path: "/Volumes/Angel/40-ai/model-cache/whisper/ggml-base.en.bin"
    #
    # Spoken language, or "auto" to let the engine detect it.
    language: "en"
    # Only the first N seconds of a long recording are transcribed: this is
    # evidence about a file, not a subtitle track.
    max_audio_seconds: 600
    timeout_seconds: 300

media:
  heic_to_jpeg:
    enabled: true
    preserve_original: true
    jpeg_quality: 100
    preserve_metadata: true
    preserve_icc_profile: true
    normalize_orientation: true

# Immediate off-site backup (D-018). The source UUID is deliberately inherited
# from t7.volume_uuid above so this file has one machine-specific identity.
# The repository is encrypted restic data accessed through rclone; it is not a
# Google Drive Desktop mirror. Keep OAuth credentials and the Keychain password
# outside this repository.
backup:
  repository: "rclone:gdrive-backup:AI-Homelab-Backups/T7-restic"
  keychain_service: "ai-homelab-t7-restic"
  rclone_keychain_service: "ai-homelab-rclone-config"
  retention:
    # Preview is always safe. Keep this false until a tested restore drill and
    # explicit operator decision authorize a future forget/prune run.
    enabled: false
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
    keep_yearly: 0
  # Relative to the UUID-verified T7 root. Choose a small durable marker or
  # directory for the monthly restore drill; null disables the drill safely.
  restore_drill_relative_path: null
  # Only incomplete ingestion artifacts and macOS volume metadata are
  # excluded. Originals, catalog, sidecars, manifests, and derivatives remain
  # protected. `.Spotlight-V100` is SIP-protected and unreadable even to the
  # owner; without excluding it restic exits 3 on every otherwise-healthy run.
  exclude_patterns:
    - "90-system/staging/**"
    # Volume-local runtime scratch (docs/25). Regenerable by definition.
    - "90-system/cache/**"
    # Downloadable model weights are regenerated from recorded provider/tag/digest.
    # Manifests and evaluation records under 40-ai remain backed up.
    - "40-ai/model-cache/**"
    - "**/*.partial"
    - ".Spotlight-V100"
    - ".fseventsd"
    - ".TemporaryItems"
    - ".Trashes"
